              checkpoint()
              result = fn(*args, **kwargs)
              checkpoint()
              return result

          def uint(value, positive=False, limit=(1 << 64) - 1):
              if not re.fullmatch(r'0|[1-9][0-9]{0,19}', value):
                  raise ValueError('identity')
              number = int(value)
              if number > limit or positive and number == 0:
                  raise ValueError('identity')
              return number

          def metadata(value):
              for key in ('st_dev', 'st_ino', 'st_uid', 'st_gid', 'st_mode'):
                  number = getattr(value, key)
                  if type(number) is not int or number < 0 or number > (1 << 64) - 1:
                      raise ValueError('metadata')
              if value.st_ino == 0:
                  raise ValueError('metadata')
              return value

          def identity(value):
              return value.st_dev, value.st_ino

          def open_dir(name, parent=None):
              kwargs = {} if parent is None else {'dir_fd': parent}
              fd = call(os.open, name, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW | os.O_CLOEXEC, **kwargs)
              fds.append(fd)
              return fd

          def permissions(fd):
              value = metadata(call(os.fstat, fd))
              mount = call(os.fstatvfs, fd)
              if type(mount.f_flag) is not int or mount.f_flag & os.ST_NOEXEC:
                  raise ValueError('mount')
              names = call(os.listxattr, fd)
              if not isinstance(names, list) or len(names) > 128 or any(type(name) is not str for name in names):
                  raise ValueError('acl')
              if sum(len(name.encode('utf8')) for name in names) > 4096 or any(name in ('system.posix_acl_access', 'system.posix_acl_default') for name in names):
                  raise ValueError('acl')
              return value

          def directory(fd, mode):
              value = permissions(fd)
              if not stat.S_ISDIR(value.st_mode) or value.st_uid != 0 or value.st_gid != 0 or stat.S_IMODE(value.st_mode) != mode:
                  raise ValueError('parent')
              return value

          def linked(parent, name, fd):
              entry = metadata(call(os.stat, name, dir_fd=parent, follow_symlinks=False))
              value = metadata(call(os.fstat, fd))
              if identity(entry) != identity(value) or entry.st_mode != value.st_mode:
                  raise ValueError('substitution')

          try:
              if len(sys.argv) != 8 or call(os.geteuid) != 0:
                  raise ValueError('authority')
              root, user, group, root_device, root_inode, workload_device, workload_inode = sys.argv[1:]
              if not re.fullmatch(r'/var/tmp/kopplas-owned-[0-9a-f]{32}', root):
                  raise ValueError('binding')
              user = uint(user, True, (1 << 32) - 2)
              group = uint(group, True, (1 << 32) - 2)
              expected_root = uint(root_device), uint(root_inode, True)
              expected_workload = uint(workload_device), uint(workload_inode, True)
              for name in ('O_DIRECTORY', 'O_NOFOLLOW', 'O_CLOEXEC', 'O_CREAT', 'O_EXCL', 'ST_NOEXEC'):
                  if type(getattr(os, name)) is not int:
                      raise ValueError('unsupported')
              base = open_dir('/')
              directory(base, 0o755)
              var = open_dir('var', base)
              directory(var, 0o755)
              tmp = open_dir('tmp', var)
              directory(tmp, 0o1777)
              private_name = root.rsplit('/', 1)[1]
              private = open_dir(private_name, tmp)
              if identity(directory(private, 0o711)) != expected_root:
                  raise ValueError('binding')
              workload = open_dir('workload', private)
              if identity(directory(workload, 0o555)) != expected_workload:
                  raise ValueError('binding')
              linked(tmp, private_name, private)
              linked(private, 'workload', workload)
              slot = call(os.open, 'next-env.d.ts', os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW | os.O_CLOEXEC, 0o600, dir_fd=workload)
              fds.append(slot)
              value = permissions(slot)
              if not stat.S_ISREG(value.st_mode) or stat.S_IMODE(value.st_mode) != 0o600 or value.st_uid != 0 or value.st_gid != 0 or value.st_size != 0 or value.st_nlink != 1 or value.st_dev != expected_workload[0]:
                  raise ValueError('file')
              linked(workload, 'next-env.d.ts', slot)
              linked(tmp, private_name, private)
              linked(private, 'workload', workload)
              call(os.fchown, slot, user, group)
              linked(workload, 'next-env.d.ts', slot)
              call(os.fchmod, slot, 0o600)
              value = permissions(slot)
              if not stat.S_ISREG(value.st_mode) or stat.S_IMODE(value.st_mode) != 0o600 or value.st_uid != user or value.st_gid != group or value.st_size != 0 or value.st_nlink != 1:
                  raise ValueError('file')
              linked(workload, 'next-env.d.ts', slot)
              linked(tmp, private_name, private)
              linked(private, 'workload', workload)
              directory(private, 0o711)
              directory(workload, 0o555)
              ready = True
          except Exception:
              ready = False
          finally:
              for fd in reversed(fds):
                  try:
                      os.close(fd)
                  except Exception:
                      ready = False
          if time.monotonic() - started >= MAX_SECONDS:
              ready = False
          if ready:
              try:
                  result = b'next_env_admitted=true\n'
                  if len(result) > MAX_BYTES or os.write(1, result) != len(result) or time.monotonic() - started >= MAX_SECONDS:
                      ready = False
              except Exception:
                  ready = False
          raise SystemExit(0 if ready else 1)
          PY_GENERATED_NEXT_ENV
            )"
            test "$next_env_admitted" = next_env_admitted=true
          fi
          # GENERATED-NEXT-ENV-ADMISSION-END
          # HOSTED-PATH-METADATA-BASH-BEGIN
          # Diagnostic only: one-second collection, two-second TERM, one-second KILL.
          # UNKNOWN or unavailable metadata never changes preparation/native execution.
          printf '%s\n' 'path_metadata_written=false' >> "$GITHUB_OUTPUT" || :
          if [ "$FIXED_CHROMIUM_HOSTED_ADMISSION" = capability ]; then
            if /usr/bin/timeout --signal=TERM --kill-after=1s 2s python3 - "$private_root/workload" "$uid" "$gid" <<'PY_PATH_METADATA' >/dev/null 2>&1
          # HOSTED-PATH-METADATA-COLLECTOR-BEGIN
          import json, os, stat, sys, time
          MAX_SECONDS = 1.0
          MAX_BYTES = 4096
          MAX_COMPONENTS = 12
          SINK_NAME = 'fixed-chromium-hosted-path-admission.json'
          class Unknown(Exception):
              pass
          def run_metadata():
              start = time.monotonic()
              def live():
                  if time.monotonic() - start >= MAX_SECONDS:
                      raise Unknown()
              def number(value):
                  return type(value) is int and 0 <= value <= 4294967295
              receipt = {'schemaVersion': 1, 'kind': 'hosted-path-metadata', 'collectionState': 'UNKNOWN',
                  'reason': 'INPUT', 'workloadCredentials': 'UNOBSERVED', 'intendedUid': None,
                  'intendedGid': None, 'collectorIds': None, 'components': []}
              reason = None
              def unknown(value):
                  nonlocal reason
                  if reason is None:
                      reason = value
              try:
                  live()
                  ids = [os.getuid(), os.geteuid(), os.getgid(), os.getegid()]
                  if not all(number(value) for value in ids):
                      raise Unknown()
                  receipt['collectorIds'] = dict(zip(['uid', 'euid', 'gid', 'egid'], ids))
                  path = sys.argv[1]
                  uid, gid = sys.argv[2:4]
                  if len(sys.argv) != 4 or not uid.isascii() or not gid.isascii() or not uid.isdecimal() or not gid.isdecimal():
                      raise Unknown()
                  uid, gid = int(uid), int(gid)
                  if not number(uid) or not number(gid) or uid == 0 or gid == 0:
                      raise Unknown()
                  receipt['intendedUid'], receipt['intendedGid'] = uid, gid
                  if len(path) > 4096 or not path.startswith('/') or path.startswith('//') or '\\' in path or '\0' in path or '\n' in path or '\r' in path:
                      raise Unknown()
                  parts = path.split('/')[1:]
                  if not parts or parts[-1] != 'workload' or any(part in ('', '.', '..') for part in parts):
                      raise Unknown()
                  paths = ['/'] + ['/' + '/'.join(parts[:i]) for i in range(1, len(parts) + 1)]
                  if len(paths) > MAX_COMPONENTS:
                      unknown('DEPTH')
                  else:
                      for index, component in enumerate(paths):
                          row = {'index': index, 'label': 'workload' if index == len(paths) - 1 else
                              'session-root' if index == len(paths) - 2 else 'ancestor', 'uid': None,
                              'gid': None, 'mode': None, 'type': 'UNKNOWN', 'symlink': None, 'aclPresence': 'UNKNOWN'}
                          receipt['components'].append(row)
                          live()
                          try:
                              value = os.lstat(component)
                              live()
                              if not number(value.st_uid) or not number(value.st_gid) or type(value.st_mode) is not int:
                                  unknown('FILESYSTEM')
                                  break
                              row.update(uid=value.st_uid, gid=value.st_gid, mode=stat.S_IMODE(value.st_mode),
                                  symlink=stat.S_ISLNK(value.st_mode), type='symlink' if stat.S_ISLNK(value.st_mode)
                                  else 'directory' if stat.S_ISDIR(value.st_mode) else 'other')
                              if row['type'] != 'directory':
                                  unknown('SYMLINK' if row['symlink'] else 'FILESYSTEM')
                                  break
                              try:
                                  names = os.listxattr(component, follow_symlinks=False)
                                  live()
                                  row['aclPresence'] = 'PRESENT' if 'system.posix_acl_access' in names else 'ABSENT'
                              except OSError:
                                  unknown('ACL')
                          except OSError:
                              unknown('FILESYSTEM')
                              break
              except Unknown:
                  unknown('DEADLINE' if time.monotonic() - start >= MAX_SECONDS else 'INPUT')
              except (OSError, AttributeError, IndexError, ValueError, TypeError):
                  unknown('UNSUPPORTED')
              receipt['reason'] = reason or 'NONE'
              receipt['collectionState'] = 'UNKNOWN' if reason else 'COMPLETE'
              parent = sink = None
              try:
                  live()
                  payload = (json.dumps(receipt, separators=(',', ':')) + '\n').encode('utf8')
                  if len(payload) > MAX_BYTES:
                      receipt.update(collectionState='UNKNOWN', reason='BYTE_CAP', components=[])
                      payload = (json.dumps(receipt, separators=(',', ':')) + '\n').encode('utf8')
                  if len(payload) > MAX_BYTES:
                      return 1
                  parent = os.open(os.environ['RUNNER_TEMP'], os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW | os.O_CLOEXEC)
                  info = os.fstat(parent)
                  live()
                  if not stat.S_ISDIR(info.st_mode) or info.st_uid != os.geteuid() or info.st_mode & 0o022:
                      return 1
                  sink = os.open(SINK_NAME, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW | os.O_CLOEXEC,
                      0o600, dir_fd=parent)
                  info = os.fstat(sink)
                  live()
                  if not stat.S_ISREG(info.st_mode) or info.st_uid != os.geteuid() or stat.S_IMODE(info.st_mode) != 0o600:
                      return 1
                  if os.write(sink, payload) != len(payload):
                      return 1
                  os.fsync(sink)
                  os.close(sink)
                  sink = None
                  live()
                  return 0  # Receipt availability only; collectionState may remain UNKNOWN.
              except (OSError, AttributeError, KeyError, Unknown):
                  return 1
              finally:
                  for fd in (sink, parent):
                      if fd is not None:
                          try:
                              os.close(fd)
                          except OSError:
                              pass
          raise SystemExit(run_metadata())
          # HOSTED-PATH-METADATA-COLLECTOR-END
          PY_PATH_METADATA
            then printf '%s\n' 'path_metadata_written=true' >> "$GITHUB_OUTPUT" || :; else :; fi
          fi
          # HOSTED-PATH-METADATA-BASH-END
          printf '%s\n' "FIXED_CHROMIUM_BROKER_ROOT=$private_root" "FIXED_CHROMIUM_WORKLOAD_REPO=$private_root/workload" "FIXED_CHROMIUM_BROKER_GENERATION=$generation" "FIXED_CHROMIUM_BROKER_SOURCE_SHA256=$source_sha" "FIXED_CHROMIUM_BROKER_UNIT=$unit" >> "$GITHUB_ENV"

      - name: Capability capsule only (no browser, application, or database execution)
        if: ${{ env.FIXED_CHROMIUM_HOSTED_ADMISSION == 'capability' }}
        run: node tests/diagnostics/fixed-chromium-application-runner.mjs --capability-capsule

      - name: Preserve capability capsule receipt
        if: ${{ !cancelled() && env.FIXED_CHROMIUM_HOSTED_ADMISSION == 'capability' }}
        uses: actions/upload-artifact@v4
        with:
          name: fixed-chromium-hosted-capability
          path: test-results/fixed-chromium-hosted-capability.json
          retention-days: 7
          if-no-files-found: error
      # HOSTED-PATH-METADATA-UPLOAD-BEGIN
      - name: Preserve bounded private path metadata (not capability acceptance)
        if: ${{ always() && !cancelled() && env.FIXED_CHROMIUM_HOSTED_ADMISSION == 'capability' && steps.hosted_session.outputs.path_metadata_written == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: fixed-chromium-hosted-path-admission
          path: ${{ runner.temp }}/fixed-chromium-hosted-path-admission.json
          retention-days: 7
          if-no-files-found: error
      # HOSTED-PATH-METADATA-UPLOAD-END
      # ROOT-SERVICE-BOOTSTRAP-END

      - name: Isolated full158 application tests (original full General population)
        # ROOT-SERVICE-CONDITION-BEGIN
        if: ${{ env.FIXED_CHROMIUM_HOSTED_ADMISSION == 'application' }}
        # ROOT-SERVICE-CONDITION-END
        # The configured reporter sums Playwright test attempts only. Its own
        # production build/web-server bootstrap remains outside the approved
        # 800-second general-browser attempt-sum execution budget.
        env:
          FIXED_CHROMIUM_EXECUTABLE: ${{ steps.fixed.outputs.executable }}
        run: node tests/diagnostics/fixed-chromium-application-runner.mjs --verify-application "$FIXED_CHROMIUM_EXECUTABLE"

      - name: Upload fixed application native JSON
        if: ${{ !cancelled() && env.FIXED_CHROMIUM_HOSTED_ADMISSION == 'application' }}
        uses: actions/upload-artifact@v4
        with:
          name: fixed-chromium-application-native
          # ROOT-SERVICE-PATH-BEGIN
          path: ${{ env.FIXED_CHROMIUM_WORKLOAD_REPO }}/test-results/fixed-chromium-application/general-browser.json
          # ROOT-SERVICE-PATH-END
          retention-days: 7
          if-no-files-found: error

      - name: Upload fixed application Playwright report
        if: ${{ !cancelled() && env.FIXED_CHROMIUM_HOSTED_ADMISSION == 'application' }}
        uses: actions/upload-artifact@v4
        with:
          name: fixed-chromium-application-report
          # ROOT-SERVICE-PATH-BEGIN
          path: ${{ env.FIXED_CHROMIUM_WORKLOAD_REPO }}/playwright-report/fixed-chromium-application/
          # ROOT-SERVICE-PATH-END
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload fixed application provenance
        if: ${{ always() && !cancelled() && env.FIXED_CHROMIUM_HOSTED_ADMISSION == 'application' }}
        uses: actions/upload-artifact@v4
        with:
          name: fixed-chromium-application-provenance
          path: test-results/fixed-chromium-application/provenance.json
          retention-days: 7
          if-no-files-found: error

      - name: Upload fresh acquisition boundary receipt
        timeout-minutes: 1
        if: ${{ always() && !cancelled() && steps.receipt_publish.conclusion == 'success' && steps.receipt_publish.outputs.acquisition_receipt_written == 'true' && env.FIXED_CHROMIUM_HOSTED_ADMISSION == 'application' }}
        uses: actions/upload-artifact@v4
        with:
          name: fixed-chromium-application-acquisition
          path: test-results/fixed-chromium-acquisition.json
          retention-days: 7
          if-no-files-found: error

      - name: Stop local Supabase stack
        # ROOT-SERVICE-CONDITION-BEGIN
        if: ${{ always() && env.FIXED_CHROMIUM_HOSTED_ADMISSION == 'application' }}
        # ROOT-SERVICE-CONDITION-END
        run: supabase stop

  # FIXED-APPLICATION-JOB-END
