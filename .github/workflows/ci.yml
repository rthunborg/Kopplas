name: CI

# Phase A verification gates (architecture §19).
# `verify` job — stages 1-5 + 10: install, lockfile guard, service-role containment
#   (source-level), typecheck, lint, unit tests, build, then the Story 2.4
#   AUTHORITATIVE built-bundle service-role containment grep over `.next` (runs
#   AFTER build — order is load-bearing).
# `db` job — stages 6 + 8 (ACTIVATED by Story 2.2): Supabase migration reset from
#   an EMPTY db, then the DB-backed integration + RLS-negative suites against the
#   LOCAL stack only — now including the Story 2.4 H4 RLS table-inventory gate that
#   fails CI when a tenant-owned table is not enrolled. See docs/quality/ci.md for
#   the gate-to-story mapping.
#
# Stop conditions honored: no secrets, no shared dev/staging/prod project, no
# deploy step. The `db` job uses the LOCAL Supabase CLI stack only (its keys are
# the universal local-demo defaults, not real secrets).

on:
  workflow_dispatch:
    inputs:
      native_stream_probe:
        description: Data-free native stream diagnostic after general E2E completes
        type: boolean
        required: false
        default: false
      # FIXED-APPLICATION-INPUT-BEGIN
      fixed_chromium_application_verification:
        description: Isolated exact full158 application verification after original General
        type: boolean
        required: false
        default: false
      # FIXED-APPLICATION-INPUT-END
      # FIXED-CHROMIUM-INPUT-BEGIN
      fixed_chromium_paired_probe:
        description: Data-free exact full-Chrome 149/158 paired stream diagnostic
        type: boolean
        required: false
        default: false
      # FIXED-CHROMIUM-INPUT-END
  pull_request:
    # Verify the dependent Epic 11 repair PRs before their approved retarget to main.
    branches:
      - main
      - codex/story-11-3-invitation-identity-binding
      - codex/story-11-3-invitation-lifecycle
      - codex/story-11-3-auth-callback
  push:
    branches: [main]

# Least privilege: this verify-only pipeline only needs to read the repo.
permissions:
  contents: read

# Cancel superseded PR runs on the same ref so CI stays small and cheap.
# Only cancel for pull_request events — a push→main run is never cancelled, so
# the post-merge safety-net run always completes for every merged commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    # Bound the job so a hung step (networked install, or the `next build`
    # Google-font fetch) fails fast instead of running to the 360-minute default.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # pnpm BEFORE setup-node: setup-node's `cache: pnpm` needs pnpm on PATH.
      # action-setup reads the version from package.json "packageManager"
      # (pnpm@10.24.0); do NOT also pass `version:` or it errors on conflict.
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup Python for focused Auto-BMAD contracts
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify lockfiles (single package manager)
        run: pnpm run verify:lockfiles

      # Dependency vulnerability scan (BLOCKING) — closes the standing NFR
      # CONCERN carried Epics 2-5 (owner decision 2026-07-03: blocking gate).
      # Fails the build on HIGH/CRITICAL advisories against the installed tree;
      # moderate/low are reported in the log but do not block. NOTE: findings
      # arrive when the npm advisory DB updates, not when code changes — a red
      # run here on an untouched branch means a new upstream advisory, and the
      # fix is a dependency bump (or a documented, dated exception), never
      # weakening the threshold.
      - name: Audit dependencies (blocking, high severity)
        run: pnpm audit --audit-level=high

      - name: Verify service-role containment (no client-path leakage)
        run: pnpm run verify:service-role-containment

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests (pure logic, node --test)
        # Test execution only: dependency installation and the later build are
        # deliberately outside the approved 180-second unit ceiling.
        run: node scripts/verify/run-with-time-budget.mjs --label "Unit tests" --max-seconds 180 -- pnpm run test:unit

      - name: BMAD focused concurrent memlog contracts
        run: pnpm run test:bmad-focused

      - name: Auto-BMAD focused routing and process-API contracts
        run: pnpm run test:auto-bmad-focused

      - name: Build
        run: pnpm build

      # Stage 10 (lightweight containment): the AUTHORITATIVE R-002 built-bundle
      # service-role grep (Story 2.4). MUST run AFTER `pnpm build` — it scans the
      # produced `.next/` payload and FAILS LOUD if `.next` is absent, so the order
      # is load-bearing (architecture §19; never reorder before build). This app
      # uses NO service-role key (anon + RLS), so a clean build yields zero hits.
      - name: Verify built-bundle service-role containment (no leakage in .next)
        run: pnpm run verify:bundle-containment

  # ──────────────────────────────────────────────────────────────────────────
  # Story 2.2 activates architecture §19 stage 6 (migration reset) + stage 8
  # (RLS-negative tests). Runs against the LOCAL Supabase CLI stack ONLY — never
  # a shared dev/staging/prod project. The local stack's keys are the universal
  # local-demo defaults (not real secrets), provided by `tests/support/test-env.ts`.
  # `SUPABASE_TEST_REQUIRED=1` makes a missing stack a HARD failure so this gate
  # can never silently false-green.
  # ──────────────────────────────────────────────────────────────────────────
  db:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Gate the expensive ~20-min Supabase boot behind the fast `verify` job: if a
    # type/lint/unit error would fail `verify`, do NOT waste CI minutes spinning up
    # the local stack (review fix 2026-06-26).
    needs: [verify]
    env:
      SUPABASE_TEST_REQUIRED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pin an EXPLICIT CLI version — `latest` lets a Supabase release silently
          # change `db reset` behavior and break the gate non-deterministically
          # (review fix 2026-06-26). Matches the version used to author the stack.
          version: 2.115.0

      # Stage 6: empty DB → migrate → seed. `supabase start` boots the local stack
      # (Docker is available on ubuntu-latest); `db reset` then applies the
      # tenant_foundation migration from empty and runs seed.sql.
      - name: Start local Supabase stack
        run: supabase start

      - name: Migration reset (empty DB → migrate → seed)
        # Bounded retry (added 2026-07-26): `supabase db reset` intermittently fails with
        # "Error status 502: An invalid response was received from the upstream server" during its
        # FINAL "Restarting containers..." step — i.e. AFTER every migration applied and seed.sql ran.
        # After a non-zero exit, the bounded verifier accepts recovery ONLY when the exact repository
        # migration ledger, local seed fixtures, and auth health all prove completion. Otherwise the
        # idempotent reset is retried; a genuinely broken migration still reds the gate.
        run: |
          for attempt in 1 2 3; do
            echo "::group::supabase db reset (attempt $attempt/3)"
            if supabase db reset; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "db reset attempt $attempt failed"
            if node scripts/verify/check-local-supabase-reset.mjs; then
              echo "db reset completed; recovered from the CLI's final restart error"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 15
            fi
          done
          echo "supabase db reset failed after 3 attempts — treating as a REAL failure"
          exit 1

      # Stage 8: DB-backed integration + cross-tenant RLS-negative suites.
      - name: Integration, RLS, and Epic 11 pilot performance gates (local stack)
        # Fixed 420s DB+pilot ceiling derives from the complete 326.38s run;
        # round 1.25x that measurement upward to a whole-minute bound.
        # Starts after stack/reset, measuring test:int and the explicit NFR
        # probe, rather than installs or Supabase startup/migration time. Keep
        # test:int visible as the historic Phase A gate; this Epic 11 probe is
        # deliberately not represented as a Phase A package-script result.
        run: >-
          node scripts/verify/run-with-time-budget.mjs --label "Database, RLS, and pilot performance tests" --max-seconds 420 -- bash -c
          'pnpm run test:int --reporter=default --reporter=github-actions --reporter=json --outputFile=test-results/full-integration.json && node --experimental-strip-types --import ./tests/support/register.mjs scripts/nfr/epic-11-r1108-baseline.ts'

      - name: Upload native full integration JSON
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: native-full-integration
          path: test-results/full-integration.json
          retention-days: 7
          if-no-files-found: error

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop

  # Synthetic, no-secret proof of the recovery Storage loader against the exact
  # pinned Compose Storage service. It derives a fresh schema-only source from
  # the local CI stack, restores it into a separate recovery volume, then proves
  # absent bytes can be materialized without changing protected logical rows.
  recovery-storage-loader:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [verify]
    env:
      SUPABASE_TEST_REQUIRED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      - name: Start local schema source
        run: supabase start

      - name: Reset local schema source
        run: supabase db reset

      - name: Dump synthetic recovery schema source
        run: |
          set -euo pipefail
          mkdir -p recovery/source
          # supabase db reset seeds a test_support trigger on public.audit_events;
          # include its schema so the selected public schema restores faithfully.
          supabase db dump --local --schema public,auth,storage,supabase_migrations,test_support --file recovery/source/schema.sql
          # CLI data dumps always exclude these managed ledgers, including when
          # their schemas are selected. Use the local database's native pg_dump.
          source_db='supabase_db_kopplas'
          docker inspect "$source_db" > /dev/null
          docker exec --user postgres "$source_db" pg_dump -U postgres -d postgres --data-only --no-owner --no-privileges --table=auth.schema_migrations --table=storage.migrations > recovery/source/platform-migration-ledgers.sql
          ledger_query="select json_build_object('auth', (select json_build_object('count', count(*), 'digest', md5(coalesce(string_agg(to_jsonb(m)::text, E'\\n' order by to_jsonb(m)::text), ''))) from auth.schema_migrations m), 'storage', (select json_build_object('count', count(*), 'digest', md5(coalesce(string_agg(to_jsonb(m)::text, E'\\n' order by to_jsonb(m)::text), ''))) from storage.migrations m))::text;"
          docker exec --user postgres "$source_db" psql -U postgres -d postgres -At -v ON_ERROR_STOP=1 -c "$ledger_query" > recovery/source/platform-migration-ledgers.json
          node scripts/ops/verify-isolated-platform-migration-ledgers.mjs recovery/source/platform-migration-ledgers.json recovery/source/platform-migration-ledgers.json
          supabase db dump --local --data-only --schema storage --exclude storage.objects --file recovery/source/storage-data.sql

      - name: Create isolated recovery runtime configuration
        run: node scripts/ops/write-recovery-runtime-config.mjs ops/recovery

      - name: Start database-only isolated recovery target
        run: |
          set -euo pipefail
          compose=(docker compose -f ops/recovery/compose.db-bootstrap.yaml -f ops/recovery/.private.db-bootstrap.compose.yaml)
          if ! "${compose[@]}" up --detach --wait --wait-timeout 120; then
            # This runner has generated synthetic-only credentials and no archive. Limit
            # output to database startup diagnostics and redact credential-shaped values.
            "${compose[@]}" ps --format 'table {{.Service}}\t{{.State}}\t{{.ExitCode}}' || true
            "${compose[@]}" logs --no-color --tail=80 db 2>&1 | grep -Ei 'fatal|error|panic|initdb|postgres|database system|permission denied|could not|invalid|role' | sed -E -e 's#(postgres(ql)?://)[^[:space:]@]+@#\1[redacted]@#Ig' -e 's#((password|secret|token|key)[=:])[^[:space:]]+#\1[redacted]#Ig' || true
            echo 'Synthetic isolated database-only target failed to start.' >&2
            exit 1
          fi

      - name: Restore synthetic schema source
        run: |
          set -euo pipefail
          db=(docker compose -f ops/recovery/compose.db-bootstrap.yaml -f ops/recovery/.private.db-bootstrap.compose.yaml exec -T db psql -v ON_ERROR_STOP=1 -U supabase_admin -d postgres)
          "${db[@]}" -f /dev/stdin < ops/recovery/prepare-empty-restore-target.sql
          "${db[@]}" -f /dev/stdin < recovery/source/schema.sql
          "${db[@]}" -f /dev/stdin < recovery/source/storage-data.sql
          "${db[@]}" -f /dev/stdin < recovery/source/platform-migration-ledgers.sql
          "${db[@]}" -f /docker-entrypoint-initdb.d/init-scripts/99-recovery-roles.sql
          ledger_query="select json_build_object('auth', (select json_build_object('count', count(*), 'digest', md5(coalesce(string_agg(to_jsonb(m)::text, E'\\n' order by to_jsonb(m)::text), ''))) from auth.schema_migrations m), 'storage', (select json_build_object('count', count(*), 'digest', md5(coalesce(string_agg(to_jsonb(m)::text, E'\\n' order by to_jsonb(m)::text), ''))) from storage.migrations m))::text;"
          "${db[@]}" -At -c "$ledger_query" > recovery/source/platform-migration-ledgers-target.json
          node scripts/ops/verify-isolated-platform-migration-ledgers.mjs recovery/source/platform-migration-ledgers.json recovery/source/platform-migration-ledgers-target.json

      - name: Start pinned isolated Storage loader and runtime
        run: |
          set -euo pipefail
          docker compose -f ops/recovery/compose.yaml -f ops/recovery/.private.runtime.compose.yaml -f ops/recovery/compose.storage-loader.yaml --profile recovery-loader up --detach storage-loader
          runtime=(docker compose -f ops/recovery/compose.yaml -f ops/recovery/.private.runtime.compose.yaml)
          if ! "${runtime[@]}" up --detach --wait --wait-timeout 120; then
            # This runner has restored only schema-source data from `supabase db reset`.
            # Emit bounded, redacted service diagnostics without an archive or credentials.
            "${runtime[@]}" ps --format 'table {{.Service}}\t{{.State}}\t{{.ExitCode}}' || true
            "${runtime[@]}" logs --no-color --tail=80 auth rest storage gateway 2>&1 | grep -Ei 'fatal|error|panic|migration|database|permission denied|could not|invalid|role|auth' | sed -E -e 's#(postgres(ql)?://)[^[:space:]@]+@#\1[redacted]@#Ig' -e 's#((password|secret|token|key|authorization)[=:])[^[:space:]]+#\1[redacted]#Ig' || true
            echo 'Synthetic isolated recovery runtime failed to start.' >&2
            exit 1
          fi
          gateway_port_output="$("${runtime[@]}" port gateway 8000 2>&1 || true)"
          gateway_port="$(printf '%s\n' "$gateway_port_output" | sed -nE 's/.*:([0-9]+)$/\1/p' | tail -n 1)"
          gateway_id="$("${runtime[@]}" ps -q gateway 2>/dev/null || true)"
          inspect_gateway_ports() {
            printf 'Gateway port query output: %s\n' "$gateway_port_output"
            if [ -n "$gateway_id" ]; then
              docker inspect --format '{{range $port, $bindings := .NetworkSettings.Ports}}{{printf "%s=%v\n" $port $bindings}}{{end}}' "$gateway_id" || true
            fi
          }
          if ! [[ "$gateway_port" =~ ^[0-9]+$ ]] || ((10#$gateway_port < 1024 || 10#$gateway_port > 65535)); then
            "${runtime[@]}" ps --format 'table {{.Service}}\t{{.State}}\t{{.ExitCode}}' || true
            inspect_gateway_ports
            echo 'Synthetic isolated recovery gateway has no high loopback port mapping.' >&2
            exit 1
          fi
          for attempt in {1..20}; do
            if curl --fail --silent --show-error --connect-timeout 2 --max-time 5 "http://127.0.0.1:${gateway_port}/storage/v1/status" > /dev/null 2>&1; then
              printf '%s\n' "$gateway_port" > recovery/source/gateway-port.txt
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              "${runtime[@]}" ps --format 'table {{.Service}}\t{{.State}}\t{{.ExitCode}}' || true
              inspect_gateway_ports
              "${runtime[@]}" logs --no-color --tail=80 auth rest storage gateway 2>&1 | grep -Ei 'fatal|error|panic|migration|database|permission denied|could not|invalid|role|auth' | sed -E -e 's#(postgres(ql)?://)[^[:space:]@]+@#\1[redacted]@#Ig' -e 's#((password|secret|token|key|authorization)[=:])[^[:space:]]+#\1[redacted]#Ig' || true
              echo 'Synthetic isolated recovery gateway did not accept Storage status requests.' >&2
              exit 1
            fi
            sleep 1
          done

      - name: Prove physical Storage loader preserves protected rows
        run: |
          set -euo pipefail
          node scripts/ops/write-isolated-recovery-storage-fixture.mjs recovery/synthetic-storage
          db=(docker compose -f ops/recovery/compose.yaml -f ops/recovery/.private.runtime.compose.yaml exec -T db psql -v ON_ERROR_STOP=1 -U supabase_admin -d postgres)
          "${db[@]}" -f /dev/stdin < recovery/synthetic-storage/storage-seed.sql
          "${db[@]}" -At -c "select coalesce(jsonb_agg(to_jsonb(o) order by bucket_id, name, id), '[]'::jsonb)::text from storage.objects o;" > recovery/synthetic-storage/rows-before-loader.json
          loader=$(docker compose -f ops/recovery/compose.yaml -f ops/recovery/.private.runtime.compose.yaml -f ops/recovery/compose.storage-loader.yaml ps -q storage-loader)
          test -n "$loader"
          docker cp recovery/synthetic-storage/backup-workspace "$loader:/input/backup-workspace"
          docker cp recovery/synthetic-storage/storage-restore-plan.json "$loader:/input/storage-restore-plan.json"
          docker compose -f ops/recovery/compose.yaml -f ops/recovery/.private.runtime.compose.yaml -f ops/recovery/compose.storage-loader.yaml exec -T storage-loader python /opt/recovery/restore-storage-file-backend.py /input/backup-workspace /input/storage-restore-plan.json /var/lib/storage
          # Synthetic-only diagnostics: prove the loader wrote version-addressed keys into
          # the same named volume before API readback. The fixture has no customer data.
          docker compose -f ops/recovery/compose.yaml -f ops/recovery/.private.runtime.compose.yaml -f ops/recovery/compose.storage-loader.yaml exec -T storage-loader python -c 'from pathlib import Path; root = Path("/var/lib/storage"); print("\n".join(f"{path.relative_to(root)} {path.stat().st_size}" for path in sorted(root.rglob("*")) if path.is_file()))'
          set -a
          source ops/recovery/.env
          set +a
          gateway_port="$(cat recovery/source/gateway-port.txt)"
          ISOLATED_RECOVERY_STORAGE_PROOF=1 RECOVERY_SUPABASE_URL="http://127.0.0.1:${gateway_port}" RECOVERY_SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" RECOVERY_STORAGE_PROOF_FIXTURE=recovery/synthetic-storage/storage-fixture.json RECOVERY_STORAGE_PROOF_BEFORE_ROWS=recovery/synthetic-storage/rows-before-loader.json pnpm exec vitest run tests/integration/ops/recovery-storage-immutability.int.test.ts --reporter=default --reporter=github-actions --reporter=json --outputFile=test-results/isolated-storage-recovery.json
          unset SERVICE_ROLE_KEY ANON_KEY JWT_SECRET POSTGRES_PASSWORD

      - name: Upload native isolated recovery JSON
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: native-isolated-storage-recovery
          path: test-results/isolated-storage-recovery.json
          retention-days: 7
          if-no-files-found: error

      - name: Remove synthetic recovery resources
        if: always()
        run: |
          docker compose -f ops/recovery/compose.yaml -f ops/recovery/.private.runtime.compose.yaml -f ops/recovery/compose.storage-loader.yaml --profile recovery-loader down --volumes --remove-orphans > /dev/null 2>&1 || true
          docker compose -f ops/recovery/compose.db-bootstrap.yaml -f ops/recovery/.private.db-bootstrap.compose.yaml down --volumes --remove-orphans > /dev/null 2>&1 || true
          supabase stop > /dev/null 2>&1 || true
          rm -rf recovery/source recovery/synthetic-storage
          rm -f ops/recovery/.env ops/recovery/.private.db-bootstrap.compose.yaml ops/recovery/.private.runtime.compose.yaml
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Same gate as `db`: only spin up the stack + browser after the fast `verify` job
    # is green. Runs in parallel with `db` (each boots its own local stack).
    needs: [verify]
    env:
      # Auth-mail E2E must fail loudly if its required local Auth/Mailpit stack is
      # unavailable; this matches the database integration gate.
      SUPABASE_TEST_REQUIRED: "1"
      # Booking fixture helpers also preview/sign inside the Playwright worker.
      # Match the existing local seed and webServer pair; these are synthetic
      # CI-only values, not a production fallback or browser-public credential.
      BOOKING_CONFLICT_ATTESTATION_KEY_ID: "test_v1"
      BOOKING_CONFLICT_ATTESTATION_HMAC_SECRET: "local-test-only-booking-conflict-attestation-secret-v1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser (chromium + OS deps)
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pin the same explicit version as the `db` job (see its note).
          version: 2.115.0

      - name: Start local Supabase stack
        run: supabase start

      - name: Migration reset (empty DB → migrate → seed)
        # Bounded retry (added 2026-07-26): `supabase db reset` intermittently fails with
        # "Error status 502: An invalid response was received from the upstream server" during its
        # FINAL "Restarting containers..." step — i.e. AFTER every migration applied and seed.sql ran.
        # The same exact-ledger + seed + auth verifier used by `db` distinguishes completed recovery
        # from a real migration/seed failure before any retry or Playwright execution.
        run: |
          for attempt in 1 2 3; do
            echo "::group::supabase db reset (attempt $attempt/3)"
            if supabase db reset; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "db reset attempt $attempt failed"
            if node scripts/verify/check-local-supabase-reset.mjs; then
              echo "db reset completed; recovered from the CLI's final restart error"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 15
            fi
          done
          echo "supabase db reset failed after 3 attempts — treating as a REAL failure"
          exit 1

      # The Playwright webServer builds + starts the app against the local stack
      # (NEXT_PUBLIC_* are inlined from playwright.config.ts), globalSetup seeds the
      # two-tenant fixture, and the specs drive the real browser journeys (G-2/G-3).
      - name: E2E tests (Playwright)
        # The configured reporter sums Playwright test attempts only. Its own
        # production build/web-server bootstrap remains outside the approved
        # 800-second general-browser attempt-sum execution budget.
        run: pnpm run test:e2e

      - name: Upload native general browser JSON
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: native-general-browser
          path: test-results/general-browser.json
          retention-days: 7
          if-no-files-found: error

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop

  # Story19.1 required partition: isolated runner/database, own fixture setup and real read proxy.
  dashboard-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Same gate as `db`: only spin up the stack + browser after the fast `verify` job
    # is green. Runs in parallel with `db` (each boots its own local stack).
    needs: [verify]
    env:
      # Auth-mail E2E must fail loudly if its required local Auth/Mailpit stack is
      # unavailable; this matches the database integration gate.
      SUPABASE_TEST_REQUIRED: "1"
      E2E_PORT: "3201"
      DASHBOARD_PROXY_PORT: "37921"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser (chromium + OS deps)
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pin the same explicit version as the `db` job (see its note).
          version: 2.115.0

      - name: Start local Supabase stack
        run: supabase start

      - name: Migration reset (empty DB → migrate → seed)
        # Bounded retry (added 2026-07-26): `supabase db reset` intermittently fails with
        # "Error status 502: An invalid response was received from the upstream server" during its
        # FINAL "Restarting containers..." step — i.e. AFTER every migration applied and seed.sql ran.
        # The same exact-ledger + seed + auth verifier used by `db` distinguishes completed recovery
        # from a real migration/seed failure before any retry or Playwright execution.
        run: |
          for attempt in 1 2 3; do
            echo "::group::supabase db reset (attempt $attempt/3)"
            if supabase db reset; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "db reset attempt $attempt failed"
            if node scripts/verify/check-local-supabase-reset.mjs; then
              echo "db reset completed; recovered from the CLI's final restart error"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 15
            fi
          done
          echo "supabase db reset failed after 3 attempts — treating as a REAL failure"
          exit 1

      # The Playwright webServer builds + starts the app against the local stack
      # (NEXT_PUBLIC_* are inlined from playwright.config.ts), globalSetup seeds the
      # two-tenant fixture, and the specs drive the real browser journeys (G-2/G-3).
      - name: Required dashboard browser tests (dedicated fixtures and read proxy)
        # The configured reporter sums Playwright test attempts only. Its own
        # production build/web-server bootstrap remains outside the approved
        # five-minute browser execution budget.
        run: pnpm exec playwright test --config tests/e2e/dashboard/playwright.ci.config.ts

      - name: Upload native dashboard browser JSON
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: native-dashboard-browser
          path: test-results/dashboard-browser.json
          retention-days: 7
          if-no-files-found: error

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-playwright-report
          path: playwright-report/dashboard/
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop

