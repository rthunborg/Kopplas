        uses: actions/upload-artifact@v4
        with:
          name: fixed-chromium-application-report
          # ROOT-SERVICE-PATH-BEGIN
          path: ${{ env.FIXED_CHROMIUM_WORKLOAD_REPO }}/playwright-report/fixed-chromium-application/
          # ROOT-SERVICE-PATH-END
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload fixed application provenance
        if: ${{ always() && !cancelled() && env.FIXED_CHROMIUM_HOSTED_ADMISSION == 'application' }}
        uses: actions/upload-artifact@v4
        with:
          name: fixed-chromium-application-provenance
          path: test-results/fixed-chromium-application/provenance.json
          retention-days: 7
          if-no-files-found: error

      - name: Upload fresh acquisition boundary receipt
        timeout-minutes: 1
        if: ${{ always() && !cancelled() && steps.receipt_publish.conclusion == 'success' && steps.receipt_publish.outputs.acquisition_receipt_written == 'true' && env.FIXED_CHROMIUM_HOSTED_ADMISSION == 'application' }}
        uses: actions/upload-artifact@v4
        with:
          name: fixed-chromium-application-acquisition
          path: test-results/fixed-chromium-acquisition.json
          retention-days: 7
          if-no-files-found: error

      - name: Stop local Supabase stack
        # ROOT-SERVICE-CONDITION-BEGIN
        if: ${{ always() && env.FIXED_CHROMIUM_HOSTED_ADMISSION == 'application' }}
        # ROOT-SERVICE-CONDITION-END
        run: supabase stop

  # FIXED-APPLICATION-JOB-END

  # Additive data-free entry UI feedback; required jobs below never consume its
  # classifier. A green result is not auth, affected-component or release acceptance.
  feedback-scope:
    needs: [checkpoint-admission]
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.calendar_feed_cause_proof) }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      entry_ui: ${{ steps.classify.outputs.entry_ui }}
    steps:
      - name: Checkout immutable diff
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Classify additive feedback
        id: classify
        run: node scripts/ci/classify-feedback.mjs
      - name: Upload conservative classification
        uses: actions/upload-artifact@v4
        with:
          name: feedback-classification
          path: test-results/feedback-classification.json
          retention-days: 7
          if-no-files-found: error

  entry-ui-feedback:
    needs: [checkpoint-admission, feedback-scope]
    if: ${{ needs.feedback-scope.outputs.entry_ui == 'true' }}
    runs-on: ubuntu-latest
    # Five minutes is a measured objective, not an execution acceptance cutoff.
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        id: node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        timeout-minutes: 3
        run: pnpm install --frozen-lockfile

      # Intermediates only: never restore a .next build, auth state or test data.
      # Source-specific writes; restore only within the same toolchain/config/env.
      - name: Cache Next build intermediates
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-intermediates-${{ runner.os }}-${{ steps.node.outputs.node-version }}-entry-ui-v1-${{ hashFiles('pnpm-lock.yaml', '.nvmrc', 'next.config.*', 'tsconfig.json', 'postcss.config.*', 'playwright.config.ts', 'tests/support/test-env.ts', '.github/workflows/ci.yml', 'scripts/ci/browser-runtime.mjs', 'scripts/ci/timed-build.mjs', 'tests/feedback/playwright.config.ts') }}-${{ hashFiles('src/**') }}
          restore-keys: next-intermediates-${{ runner.os }}-${{ steps.node.outputs.node-version }}-entry-ui-v1-${{ hashFiles('pnpm-lock.yaml', '.nvmrc', 'next.config.*', 'tsconfig.json', 'postcss.config.*', 'playwright.config.ts', 'tests/support/test-env.ts', '.github/workflows/ci.yml', 'scripts/ci/browser-runtime.mjs', 'scripts/ci/timed-build.mjs', 'tests/feedback/playwright.config.ts') }}-

      # Browser + Linux dependencies are preinstalled in the reviewed official
      # image. Keep the host Node/Next/Supabase topology and use a loopback protocol.
      - name: Start pinned Playwright browser service
        timeout-minutes: 6
        run: node scripts/ci/browser-runtime.mjs start

      - name: Production entry UI feedback (two isolated data-free viewports)
        timeout-minutes: 6
        run: pnpm exec playwright test --config tests/feedback/playwright.config.ts

      - name: Upload entry UI native results and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: entry-ui-feedback
          path: |
            test-results/entry-ui.json
            test-results/entry-ui/
          retention-days: 7
          if-no-files-found: error

      - name: Upload browser runtime identity and timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-runtime-${{ github.job }}
          path: |
            ${{ runner.temp }}/browser-runtime-${{ github.job }}.json
            ${{ runner.temp }}/build-timing-${{ github.job }}.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop owned Playwright browser service
        if: always()
        timeout-minutes: 1
        run: node scripts/ci/browser-runtime.mjs stop
