name: Frontend visual acceptance controller
# Trusted base/default branch only. Never checkout or execute a PR head.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
    branches: [main]
  issue_comment:
    types: [created, edited, deleted]
  schedule:
    - cron: '11,41 * * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: Exact open PR number to reassess
        type: string
        required: true
permissions:
  contents: read
  pull-requests: read
  issues: read
  checks: write
concurrency:
  group: frontend-visual-${{ github.event.pull_request.number || github.event.issue.number || 'monitor' }}
  cancel-in-progress: false
jobs:
  assess:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.ref == 'refs/heads/main' &&
      (github.event_name != 'issue_comment' || github.event.issue.pull_request))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Verify immutable image evidence and authenticated acceptance
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/quality/frontend-controller.mjs hosted
