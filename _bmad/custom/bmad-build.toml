# Project-owned; survives BMAD reinstall. See docs/process/review-order.md.
[workflow]
activation_steps_append = ['''
Read {project-root}/docs/process/agent-model-routing.md. Use gpt-6.1-sol Low for ordinary development and review. Assess the actual task/diff; tenant isolation, tenancy/provisioning, RBAC, permissions, auth, security/RLS, secrets/public-token boundaries, money/tax and transactional integrity require High. Effort selection/escalation is owner-authorized; never ask permission. If the current Low session cannot perform the selected higher-effort work, dispatch a generic context-free High delegate synchronously and use its result. Explicit effort overrides may exceed the Low parent; an already-routed delegate does not recursively re-delegate solely for effort. Preserve all unrelated authorization, sandbox, resource, test and review rules.
''']
persistent_facts = ["Before a completed frontend implementation or review claim, run the frontend quality gate policy; Auto-BMAD completion/status/finalization uses its project pre-transition wrapper. Missing acceptance blocks readiness; no new result/config keys.", "file:{project-root}/docs/process/development-completion-policy.md", "file:{project-root}/docs/process/review-order.md", "file:{project-root}/docs/process/agent-model-routing.md", "file:{project-root}/docs/quality/frontend-quality-gate.md"]
implementation_handoff = '''
Launch a subagent with no prior conversation context using `gpt-6.1-sol` on Codex. Select Low by default for ordinary development and review, and automatically select High for tenant isolation, tenancy/provisioning, RBAC, permissions, auth, security/RLS, secrets/public-token boundaries, money/tax and transactional integrity; no permission question is needed, following docs/process/agent-model-routing.md. Carry that model/effort policy into every nested handoff. With this prompt:

Read {project-root}/docs/process/development-completion-policy.md and apply its development gate, release deferral, bounded recovery and evidence contract. Read {spec_file} fully and implement it; the spec is the source of truth. Load every file in its context frontmatter before starting. Also read {project-root}/docs/process/review-order.md and {project-root}/_bmad/custom/review-order-template.md.
Before returning any completed frontend work, apply docs/quality/frontend-quality-gate.md and run its exact-candidate authenticated local gate with the recorded full baseline. Missing/stale/failed acceptance blocks the completion claim; do not defer it as polish.
You are the implementation author. Own and write exactly one Suggested Review Order after implementation and verification, before returning for review. Explain your recorded choices; verify repository-relative path:line stops and useful literal symbol anchors; map important ACs/invariants to tests and state evidence limits. Do not invent rationale. Refresh the same section after every review-fix batch or re-derivation, preserving frozen intent. Return what changed, verification, and anything incomplete or risky. Remain available for synchronous fix and final-trail reconciliation handoffs.
'''
on_complete = '''
Read docs/process/review-order.md from the project root and follow its Completion-hook protocol using this run's already-resolved spec_file runtime variable; if it is absent or its file does not exist, report no reconciliation and preserve the original result. For a completed implementation, the implementation/fix author (the current implementer on one-shot) reconciles and validates exactly one final author section after all fixes, including any generated duplicate from Build presentation. Preserve non-done exits. Report final evidence and revision; do not ask for an extra owner confirmation. This hook runs within Build, never as auto-bmad root story work.

Apply {project-root}/docs/quality/frontend-quality-gate.md to this exact candidate and final diff. A frontend completion/review claim requires the executable authenticated gate; never interpret provider error/unavailable/skipped as PASS. The implementation handoff must run `node scripts/quality/frontend-controller.mjs local --base <recorded-full-baseline>` before returning completed work. For Auto-BMAD completion/status/finalization mutations use the project pre-transition wrapper `node scripts/quality/completion-gate.mjs <recorded-full-baseline> <original-helper-name.py> <unchanged-original-arguments>` in place of direct delivery_gate.py/state_update.py/state_plan.py/story_plan.py execution; do not add config or result keys. The existing helper still enforces its original record. This post-terminal hook itself cannot undo an installed done/result: if the gate was missed, report visual acceptance blocked through existing summary/residual-risk fields and keep PR readiness blocked; do not fabricate a pass or rewrite historical state. Recheck affected evidence after every fix/new head. Read-only reviews report missing acceptance without authoring it.
'''
