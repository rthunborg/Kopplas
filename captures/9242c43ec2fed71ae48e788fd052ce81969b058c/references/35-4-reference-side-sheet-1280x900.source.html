<!doctype html><html lang="sv"><head><meta charset="utf-8"><link rel="icon" href="data:,"><link rel="stylesheet" href="/styles.css"><style>html,body{margin:0;font-family:var(--font-core);color:#0d0d0f;background:#ffffff}*{box-sizing:border-box}.ref-label{font-size:11px;line-height:1.45;color:#57575c;margin:0 0 16px}.ref-scrim{position:fixed;inset:0;background:#0d0d0f7a}.ref-sheet{position:fixed;inset:0 0 0 auto;width:min(100%,520px);padding:24px;border-radius:12px;background:#ffffff;box-shadow:0 16px 40px -8px rgb(13 13 15 / .14),0 2px 6px rgb(13 13 15 / .05)}.ref-header{display:flex;gap:12px;align-items:center;justify-content:space-between}.ref-title{font-size:17px;font-weight:500;letter-spacing:-.018em}.ref-action,.ref-chip{min-height:44px;border:1px solid #95959b;border-radius:8px;background:#ffffff;color:#0d0d0f;font:500 13px var(--font-core);padding:12px 16px}.ref-media{height:240px;margin:24px 0;background:#f5f5f6;border:1px solid #d6d6d9;border-radius:8px}.ref-chip{display:inline-flex;max-width:100%;align-items:center;gap:8px;background:#f5f5f6;text-decoration:underline;text-underline-offset:4px}.ref-chip svg{width:16px;height:16px;flex:none}.ref-chip span{overflow-wrap:anywhere}.ref-frame{padding:24px}.ref-copy{font-size:13px;line-height:1.45;color:#3d3d41}@media(max-width:600px){.ref-frame{padding:16px}.ref-sheet{padding:24px}}</style></head><body><div class="ref-scrim"></div><section class="ref-sheet" aria-label="SideSheet reference"><p class="ref-label">AUTHORED DERIVED REFERENCE · SideSheet</p><header class="ref-header"><h1 class="ref-title">Förhandsvisning</h1><button class="ref-action">Stäng</button></header><button class="ref-action">Tillbaka till listan</button><p class="ref-copy">Mönster för valt dokument</p><div class="ref-media" aria-label="Neutral medieyta"></div><button class="ref-action">Förnya åtkomst</button></section></body></html>
