<!-- @dsCard group="Brand" viewport="700x150" name="Status pattern" subtitle="A 6px dot plus the word — the most repeated pattern in the app" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{padding:24px;font-family:var(--font-core)}.lab{font-size:11px;letter-spacing:var(--track-caps);text-transform:uppercase;color:var(--text-tertiary)}.mono{font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary)}</style></head><body><div style="display:flex;gap:24px;align-items:center;font-size:14px;flex-wrap:wrap"><span style="display:inline-flex;align-items:center;gap:7px"><span style="width:6px;height:6px;border-radius:99px;background:var(--n-400)"></span>Utkast</span><span style="display:inline-flex;align-items:center;gap:7px"><span style="width:6px;height:6px;border-radius:99px;background:var(--info-500)"></span>Planerad</span><span style="display:inline-flex;align-items:center;gap:7px"><span style="width:6px;height:6px;border-radius:99px;background:var(--signal-500)"></span>Pågår</span><span style="display:inline-flex;align-items:center;gap:7px"><span style="width:6px;height:6px;border-radius:99px;background:var(--warn-500)"></span>Väntar på attest</span><span style="display:inline-flex;align-items:center;gap:7px"><span style="width:6px;height:6px;border-radius:99px;background:var(--ok-500)"></span>Klart</span><span style="display:inline-flex;align-items:center;gap:7px"><span style="width:6px;height:6px;border-radius:99px;background:var(--risk-500)"></span>Avvikelse</span></div><div class="mono" style="margin-top:18px">never a glyph, never emoji — dot + word</div></body></html>
