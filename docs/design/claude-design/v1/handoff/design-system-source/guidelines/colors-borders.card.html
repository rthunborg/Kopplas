<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{padding:24px;font-family:var(--font-core)}.lab{font-size:11px;letter-spacing:var(--track-caps);text-transform:uppercase;color:var(--text-tertiary)}.mono{font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary)}</style></head><body><div style="display:flex;gap:14px">
<div style="flex:1;height:92px;background:var(--bg-page);border:1px solid var(--border-subtle);border-radius:var(--radius-card);padding:10px"><div class="mono">--border-subtle</div></div>
<div style="flex:1;height:92px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:var(--radius-card);padding:10px"><div class="mono">--border-default</div></div>
<div style="flex:1;height:92px;background:var(--bg-sunken);border:1px solid var(--border-strong);border-radius:var(--radius-card);padding:10px"><div class="mono">--border-strong</div></div>
<div style="flex:1;height:92px;background:var(--bg-inset);border:1px solid var(--border-default);border-radius:var(--radius-card);padding:10px"><div class="mono">--bg-inset</div></div>
</div></body></html>
