<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{padding:24px;font-family:var(--font-core)}.lab{font-size:11px;letter-spacing:var(--track-caps);text-transform:uppercase;color:var(--text-tertiary)}.mono{font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary)}</style></head><body><div style="display:flex;gap:32px;align-items:flex-end">
<div><div style="font-size:24px;color:var(--text-primary);letter-spacing:-.018em">Primary</div><div class="mono">--text-primary · #0d0d0f</div></div>
<div><div style="font-size:24px;color:var(--text-secondary);letter-spacing:-.018em">Secondary</div><div class="mono">--text-secondary · #57575c</div></div>
<div><div style="font-size:24px;color:var(--text-tertiary);letter-spacing:-.018em">Tertiary</div><div class="mono">--text-tertiary · #95959b</div></div>
<div><div style="font-size:24px;color:var(--text-disabled);letter-spacing:-.018em">Disabled</div><div class="mono">--text-disabled</div></div>
</div></body></html>
