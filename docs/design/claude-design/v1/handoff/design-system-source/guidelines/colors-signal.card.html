<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{padding:24px;font-family:var(--font-core)}.lab{font-size:11px;letter-spacing:var(--track-caps);text-transform:uppercase;color:var(--text-tertiary)}.mono{font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary)}</style></head><body><div style="display:flex;gap:16px;align-items:stretch">
<div style="flex:1;background:var(--signal-400);height:88px;border-radius:var(--radius-sm);display:flex;align-items:flex-end;padding:10px"><span class="mono" style="color:var(--n-950)">--signal-400 · #ffd21f</span></div>
<div style="width:110px;background:var(--signal-500);height:88px;border-radius:var(--radius-sm)"></div>
<div style="width:110px;background:var(--signal-200);height:88px;border-radius:var(--radius-sm)"></div>
<div style="width:110px;background:var(--signal-050);height:88px;border-radius:var(--radius-sm);border:1px solid var(--border-default)"></div>
</div>
<div style="margin-top:14px;display:flex;gap:12px;align-items:center"><span style="background:var(--signal-400);color:var(--n-950);font-size:13px;font-weight:500;padding:7px 14px;border-radius:var(--radius-sm)">Boka demo</span><span style="display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-secondary)"><span style="width:6px;height:6px;border-radius:99px;background:var(--signal-500)"></span>Pågår</span><span class="mono">black text on signal, never white</span></div></body></html>
