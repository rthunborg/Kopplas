<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Kopplas app screen" description="Sidebar + sticky topbar + card grid — the standard Kopplas operations view." -->
<helmet><script src="./ds-base.js"></script><style>html,body{margin:0;height:100%}#root,body{height:100%}</style></helmet>
<div style="display:flex;height:100vh;background:var(--bg-page);font-family:var(--font-core);color:var(--text-primary)">
<x-import component-from-global-scope="KopplaDesignSystem_4b46f2.SidebarNav" items="{{ navItems }}" value="{{ view }}" onSelect="{{ setView }}" hint-size="248px,100%"></x-import>
<div style="flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden">
<x-import component-from-global-scope="KopplaDesignSystem_4b46f2.TopBar" title="Översikt" subtitle="Elpro Syd AB · mars 2026" hint-size="100%,56px"></x-import>
<main style="flex:1;min-height:0;overflow-y:auto;padding:24px 24px 72px">
<div style="display:grid;gap:24px;max-width:1240px">
<x-import component-from-global-scope="KopplaDesignSystem_4b46f2.Banner" tone="warn" title="2 tidrapporter väntar på attest" hint-size="100%,56px">Attestera före fredag så kommer de med på marsfakturan.</x-import>
<div style="display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--border-default);border-radius:8px;overflow:hidden">
<div style="padding:24px"><x-import component-from-global-scope="KopplaDesignSystem_4b46f2.Metric" label="Fakturerat i mars" value="284 500 kr" delta="↑ 4 %" deltaTone="up" size="sm" hint-size="100%,58px"></x-import></div>
<div style="padding:24px;border-left:1px solid var(--border-subtle)"><x-import component-from-global-scope="KopplaDesignSystem_4b46f2.Metric" label="Ej fakturerat" value="61 200 kr" size="sm" hint-size="100%,58px"></x-import></div>
<div style="padding:24px;border-left:1px solid var(--border-subtle)"><x-import component-from-global-scope="KopplaDesignSystem_4b46f2.Metric" label="Debiteringsgrad" value="84 %" size="sm" hint-size="100%,58px"></x-import></div>
<div style="padding:24px;border-left:1px solid var(--border-subtle)"><x-import component-from-global-scope="KopplaDesignSystem_4b46f2.Metric" label="Aktiva projekt" value="5" size="sm" hint-size="100%,58px"></x-import></div>
</div>
<x-import component-from-global-scope="KopplaDesignSystem_4b46f2.Card" title="Projekt i drift" padding="0" hint-size="100%,240px">
<x-import component-from-global-scope="KopplaDesignSystem_4b46f2.Table" columns="{{ columns }}" rows="{{ rows }}" hint-size="100%,220px"></x-import>
</x-import>
</div>
</main>
</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { view: 'oversikt' };
  renderVals() {
    const React_ = React;
    const NS = window.KopplaDesignSystem_4b46f2 || {};
    const StatusDot = NS.StatusDot;
    return {
      view: this.state.view,
      setView: (v) => this.setState({ view: v }),
      navItems: [
        { key: 'oversikt', label: 'Översikt', icon: 'layout-dashboard' },
        { key: 'anbud', label: 'Anbud', icon: 'file-text', count: 4 },
        { key: 'projekt', label: 'Projekt', icon: 'folder-open', count: 5 },
        { key: 'tid', label: 'Tid & attest', icon: 'clock', count: 2 },
        { section: 'Företaget' },
        { key: 'tillgangar', label: 'Tillgångar', icon: 'truck' },
        { key: 'fakturor', label: 'Fakturering', icon: 'receipt' },
      ],
      columns: [
        { key: 'namn', header: 'Projekt' },
        { key: 'status', header: 'Status', render: (r) => StatusDot ? React_.createElement(StatusDot, { status: r.status, label: r.st }) : r.st },
        { key: 'timmar', header: 'Timmar', align: 'right' },
        { key: 'belopp', header: 'Kontrakt', align: 'right' },
      ],
      rows: [
        { id: 1, namn: 'Ombyggnad Kv. Vasa 4', status: 'active', st: 'Pågår', timmar: '184 / 300 h', belopp: '284 500 kr' },
        { id: 2, namn: 'Serviceavtal Bergsgatan 12', status: 'waiting', st: 'Väntar attest', timmar: '38 / 40 h', belopp: '42 100 kr' },
        { id: 3, namn: 'Laddstolpar Hyllie P2', status: 'deviation', st: 'Avvikelse', timmar: '412 / 380 h', belopp: '611 000 kr' },
        { id: 4, namn: 'Ny elcentral Lundby skola', status: 'planned', st: 'Planerad', timmar: '0 / 210 h', belopp: '318 000 kr' },
      ],
    };
  }
}

</script>
</body>
</html>
