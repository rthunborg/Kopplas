<!DOCTYPE html><html lang="sv"><head><meta charset="utf-8"><title>Kopplas — verksamhetssystem för elektriker</title>
<link rel="stylesheet" href="../../styles.css">
<style>html,body{margin:0}a{border-bottom:0}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head><body><div id="root"></div>
<script type="text/babel" src="SiteHeader.jsx"></script>
<script type="text/babel" src="Hero.jsx"></script>
<script type="text/babel" src="Chain.jsx"></script>
<script type="text/babel" src="Pricing.jsx"></script>
<script type="text/babel" src="Footer.jsx"></script>
<script type="text/babel">
function Site() {
  const [active, setActive] = React.useState('produkt');
  const go = (k) => {
    setActive(k);
    const el = document.getElementById(k === 'demo' ? 'demo' : k);
    if (el) window.scrollTo({ top: el.offsetTop - 64, behavior: 'smooth' });
  };
  return (
    <div>
      <SiteHeader onNav={go} active={active} />
      <div id="produkt"><Hero onNav={go} /></div>
      <div id="kedjan"><Chain /></div>
      <div id="priser"><Pricing /></div>
      <div id="demo"><SiteFooter /></div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Site />);
</script></body></html>
